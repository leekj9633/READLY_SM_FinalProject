spring:
  application:
    name: READLY

  # 실제 비밀값은 git에 올리지 않는 application-local.yaml 에 둔다 (없으면 무시)
  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: jdbc:postgresql://localhost:5432/readly
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      # Render 환경변수 주입 (로컬에서는 localhost로 동작)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Render Redis에 비밀번호가 설정되어 있을 경우를 대비
      password: ${REDIS_PASSWORD:}

