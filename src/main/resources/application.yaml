# confluent 사용을 위한 설정
kafka:
  # 브로커 주소 (Render 환경변수 주입, 없으면 로컬)
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # 추가된 Confluent Cloud 보안 설정
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: PLAIN
    sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";'

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"

jwt:
  # 32바이트 이상. 환경변수 JWT_SECRET 또는 application-local.yaml 로 주입
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600

aladin:
  # 알라딘 상품 조회(ItemLookUp) API 주소
  # http로 호출하면 301(https로 이동) 응답이 오고 RestTemplate이 이를 따라가지 않으므로 반드시 https로 둔다
  base-url: https://www.aladin.co.kr/ttb/api/ItemLookUp.aspx
  # 알라딘 상품 검색(ItemSearch) API 주소. 제목으로 책을 찾아 isbn13을 얻는 데 쓴다
  search-url: https://www.aladin.co.kr/ttb/api/ItemSearch.aspx
  # 알라딘에서 발급받은 TTB Key. 절대 하드코딩하지 않는다.
  # 환경변수 ALADIN_TTB_KEY 또는 application-local.yaml 로 주입
  ttb-key: ${ALADIN_TTB_KEY}

cors:
  # 브라우저에서 이 API를 호출할 수 있는 프론트엔드 출처. 콤마로 여러 개를 넣을 수 있고,
  # "https://*.vercel.app" 같은 와일드카드 패턴도 쓸 수 있다.
  # 배포 환경에서는 CORS_ALLOWED_ORIGINS 환경변수로 실제 도메인을 주입한다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  # AI 서버가 우리 채팅 API를 호출할 때 X-AI-API-KEY 헤더에 넣어야 하는 값
  api-key: ${AI_API_KEY:default-readly-key}
