spring:
  application:
    name: READLY

  # 실제 비밀값은 git에 올리지 않는 application-local.yaml 에 둔다 (없으면 무시)
  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: jdbc:postgresql://localhost:5432/readly
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*" # 모든 패키지의 객체 변환을 허용

jwt:
  # 32바이트 이상. 환경변수 JWT_SECRET 또는 application-local.yaml 로 주입
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600

aladin:
  # 알라딘 상품 조회(ItemLookUp) API 주소
  # http로 호출하면 301(https로 이동) 응답이 오고 RestTemplate이 이를 따라가지 않으므로 반드시 https로 둔다
  base-url: https://www.aladin.co.kr/ttb/api/ItemLookUp.aspx
  # 알라딘에서 발급받은 TTB Key. 절대 하드코딩하지 않는다.
  # 환경변수 ALADIN_TTB_KEY 또는 application-local.yaml 로 주입
  ttb-key: ${ALADIN_TTB_KEY}

ai:
  base-url: http://localhost:8001
  # AI 서버가 우리 채팅 API를 호출할 때 X-AI-API-KEY 헤더에 넣어야 하는 값
  api-key: ${AI_API_KEY}
