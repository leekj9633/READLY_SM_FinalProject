spring:
  application:
    name: READLY

  # 실제 비밀값은 git에 올리지 않는 application-local.yaml 에 둔다 (없으면 무시)
  config:
    import: optional:classpath:application-local.yaml

  datasource:
    url: jdbc:postgresql://localhost:5432/readly
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

# confluent 사용 전 설정
